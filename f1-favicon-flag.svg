<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <pattern id="check" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
      <rect x="4" y="4" width="4" height="4" fill="#fff"/>
      <rect x="4" y="0" width="4" height="4" fill="#0a0a14"/>
      <rect x="0" y="4" width="4" height="4" fill="#0a0a14"/>
    </pattern>
  </defs>

  <!-- Transparent background — no <rect> background fill. -->

  <!-- Flag pole — silver/gray so it's visible on both light and dark backgrounds. -->
  <rect x="11" y="6" width="3" height="52" rx="1" fill="#888"/>
  <circle cx="12.5" cy="6" r="2.5" fill="#ffd700" stroke="#b8860b" stroke-width="0.5"/>

  <!-- Flag — waving checkered shape -->
  <path d="M14 10
           Q26 7 38 12
           Q48 16 56 12
           L56 36
           Q48 40 38 36
           Q26 31 14 34
           Z" fill="url(#check)"/>

  <!-- Subtle wave shading at the bottom of the flag -->
  <path d="M14 30
           Q26 27 38 32
           Q48 36 56 32
           L56 36
           Q48 40 38 36
           Q26 31 14 34
           Z" fill="#000" opacity="0.2"/>

  <!-- Highlight at the top of the flag -->
  <path d="M14 10
           Q26 7 38 12
           Q48 16 56 12
           L56 14
           Q48 18 38 14
           Q26 9 14 12
           Z" fill="#fff" opacity="0.25"/>
</svg>
