<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Round</title>
<link rel="icon" type="image/svg+xml" href="cocktail-favicon.svg">
<link rel="apple-touch-icon" href="cocktail-favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap">
<script src="cocktails-data.js"></script>
<style>
:root {
    /* Inspired by Teddy's (San Antonio) — teal base, peach accents */
    --bg: #1e3a32;
    --bg-secondary: #264840;
    --bg-card: #30574e;
    --border: #3d6b60;
    --text-primary: #fee6c4;          /* Teddy's peach/bisque */
    --text-secondary: #c9b89a;
    --text-muted: #7a9090;
    --accent: #fee6c4;                /* peach as accent on teal */
    --accent-dim: rgba(254, 230, 196, 0.15);
    --good: #7edba6;                  /* minty green */
    --bad: #e07a7a;                   /* soft coral red */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark; scrollbar-color: var(--border) var(--bg); }
::selection { background: rgba(254, 230, 196, 0.28); color: var(--text-primary); }

/* Scrollbars — teal thumb on the page background (Safari uses the ::-webkit rules) */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb {
    background: var(--border); background-clip: padding-box;
    border: 3px solid transparent; border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background-color: var(--text-muted); }
::-webkit-scrollbar-corner { background: transparent; }
.filter-sidebar, .modal-overlay { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.filter-sidebar::-webkit-scrollbar { width: 9px; }
.filter-sidebar::-webkit-scrollbar-track, .modal-overlay::-webkit-scrollbar-track { background: transparent; }

body {
    font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 400;
    background: var(--bg); color: var(--text-primary);
    min-height: 100vh; line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.navbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 1.5rem; background: var(--bg-secondary);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
}
.brand {
    display: flex; align-items: center; gap: 0.6rem;
    font-weight: 600; font-size: 1.1rem; color: var(--text-primary);
}
.brand i { color: var(--accent); }
.brand:hover { text-decoration: none; }
.nav-btn {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary);
    padding: 0.45rem 0.85rem; border-radius: 8px; font-family: inherit; font-size: 0.85rem;
    cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 0.4rem;
}
.nav-btn:hover { border-color: var(--accent); }
.nav-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

.container { max-width: 1440px; margin: 0 auto; padding: 1.5rem; }

.intro {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
}
.intro h1 {
    font-size: 1.4rem; margin-bottom: 0.4rem;
    display: flex; align-items: center; gap: 0.5rem;
}
.intro h1 i { color: var(--accent); }
.intro p { color: var(--text-secondary); font-size: 0.9rem; }

/* Spirit landing */
.spirit-grid {
    display: grid; gap: 1rem;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
}
.spirit-card {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.5rem 1rem;
    text-align: center; cursor: pointer; transition: all 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    color: inherit; font: inherit; width: 100%;
}
a.spirit-card:hover { text-decoration: none; }
.spirit-card:hover {
    border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(254, 230, 196, 0.10);
}
.spirit-card .icon {
    font-size: 2.2rem; color: var(--accent); margin-bottom: 0.25rem;
}
.spirit-card h3 { font-size: 1.05rem; font-weight: 500; }
.spirit-card .desc { font-size: 0.78rem; color: var(--text-muted); }
.spirit-card .count-pill {
    background: var(--bg-card); color: var(--text-secondary);
    padding: 0.2rem 0.6rem; border-radius: 999px;
    font-size: 0.72rem; font-weight: 600; margin-top: 0.4rem;
}

.results-header {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 1.25rem; flex-wrap: wrap;
}
.spirit-title {
    flex: 1; font-size: 1.2rem; font-weight: 600;
    display: flex; align-items: center; gap: 0.5rem;
}
.spirit-title i { color: var(--accent); }
.nav-btn.surprise:hover { border-color: var(--good); color: var(--good); }

/* Style step (sour vs stirred) — bigger 2-col cards */
.style-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.style-grid .spirit-card { padding: 2.25rem 1.25rem; }
.style-grid .spirit-card .icon { font-size: 2.8rem; }
.style-grid .spirit-card h3 { font-size: 1.25rem; }
.style-skip {
    display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap;
    margin-top: 1.25rem;
}

/* Style chip in header — slightly distinct so it reads as the active style filter */
#styleChip {
    background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
}
#styleChip:hover { background: var(--accent); color: var(--bg); }

/* ── Results layout: collapsible filter sidebar + results ── */
.results-layout { display: flex; gap: 1.25rem; align-items: flex-start; }
.results-main { flex: 1; min-width: 0; }

.filter-sidebar {
    flex: 0 0 290px; width: 290px;
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 14px; padding: 1rem 1.1rem;
    position: sticky; top: 80px;
    max-height: calc(100vh - 100px); overflow-y: auto;
    display: none;                       /* collapsed by default */
}
#resultsView.filter-open .filter-sidebar { display: block; }
.filter-head {
    display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.85rem;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-secondary);
}
.filter-head i { color: var(--accent); }
.filter-head #selectedCount {
    margin-left: auto; color: var(--text-muted);
    text-transform: none; letter-spacing: 0; font-size: 0.72rem;
}
.filter-close {
    display: none; background: none; border: 1px solid var(--border);
    color: var(--text-secondary); width: 28px; height: 28px; flex: 0 0 auto;
    border-radius: 7px; cursor: pointer; align-items: center; justify-content: center;
}
.filter-close:hover { border-color: var(--bad); color: var(--bad); }
.filter-actions { display: none; gap: 0.5rem; margin-top: 1rem; }
.filter-actions .clear-btn {
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    padding: 0.6rem 0.9rem; border-radius: 8px; font-family: inherit; font-size: 0.85rem; cursor: pointer;
}
.filter-actions .clear-btn:hover { border-color: var(--bad); color: var(--bad); }
.filter-actions .filter-apply {
    flex: 1; background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent);
    padding: 0.6rem 0.9rem; border-radius: 8px; font-family: inherit; font-size: 0.9rem;
    font-weight: 600; cursor: pointer;
}
.filter-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 60; }

/* Filter toggle button in toolbar — styled as a primary action so it's discoverable */
#filterToggle {
    width: auto; padding: 0 0.9rem; gap: 0.45rem; font-weight: 500;
    border-color: var(--accent); color: var(--accent);
}
#filterToggle:hover { background: var(--accent-dim); }
#filterToggle.has-filters { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.filter-count-badge {
    background: var(--accent); color: var(--bg); border-radius: 999px;
    font-size: 0.66rem; font-weight: 700; padding: 0.05rem 0.4rem;
    min-width: 1.15rem; text-align: center;
}

@media (max-width: 760px) {
    .filter-sidebar {
        position: fixed; left: 0; right: 0; bottom: 0; top: auto;
        width: 100%; flex-basis: auto; max-height: 82vh;
        border-radius: 18px 18px 0 0; border-bottom: none; z-index: 70;
        display: block; transform: translateY(110%); transition: transform 0.28s ease;
    }
    #resultsView.filter-open .filter-sidebar { transform: translateY(0); }
    #resultsView.filter-open .filter-backdrop { display: block; }
    .filter-sidebar::before {
        content: ''; display: block; width: 40px; height: 4px;
        border-radius: 2px; background: var(--border); margin: 0 auto 0.9rem;
    }
    .filter-close { display: inline-flex; }
    .filter-actions { display: flex; }
}

.panel {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.25rem;
}
.panel h2 {
    font-size: 1rem; font-weight: 500; margin-bottom: 0.75rem;
    display: flex; align-items: center; gap: 0.5rem;
    color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;
}
.panel h2 .count {
    margin-left: auto; background: var(--bg-card); color: var(--text-secondary);
    padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.7rem; letter-spacing: 0;
}

.search-input {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-primary); padding: 0.55rem 0.85rem; border-radius: 8px;
    font-family: inherit; font-size: 0.9rem; margin-bottom: 0.85rem;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { outline: none; border-color: var(--accent); }

/* Landing search — direct "I know what I want" path */
.landing-search-wrap { position: relative; margin-top: 1rem; }
.landing-search-wrap > i.fa-magnifying-glass {
    position: absolute; left: 0.95rem; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 0.9rem; pointer-events: none;
}
.landing-search {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-primary); padding: 0.7rem 2.6rem; border-radius: 10px;
    font-family: inherit; font-size: 0.95rem; transition: border-color 0.15s;
}
.landing-search::placeholder { color: var(--text-muted); }
.landing-search:focus { outline: none; border-color: var(--accent); }
.landing-search-clear {
    position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 0.95rem; padding: 0.3rem; line-height: 1;
}
.landing-search-clear:hover { color: var(--bad); }

.ingredient-cat {
    margin-bottom: 1rem;
}
.ingredient-cat-title {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500;
}
.ingredient-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.ing-pill {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-primary); padding: 0.35rem 0.7rem; border-radius: 999px;
    font-size: 0.78rem; cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 0.35rem; user-select: none;
}
.ing-pill:hover { border-color: var(--accent); }
.ing-pill.selected {
    background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
    font-weight: 600;
}
.ing-pill .qty { color: var(--text-muted); font-size: 0.7rem; }

.results-summary {
    color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.85rem;
}
.results-summary .clear-btn {
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    padding: 0.25rem 0.7rem; border-radius: 8px; font-family: inherit; font-size: 0.75rem;
    cursor: pointer; margin-left: 0.5rem;
}
.results-summary .clear-btn:hover { border-color: var(--bad); color: var(--bad); }

.results-grid {
    display: grid; gap: 0.85rem;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}
.cocktail-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem; cursor: pointer;
    transition: all 0.15s; position: relative;
    overflow: hidden; min-width: 0;
}
.cocktail-card * { min-width: 0; }
.cocktail-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.cocktail-card h3 {
    font-size: 1rem; font-weight: 500; margin-bottom: 0.4rem;
    padding-right: 2.5rem;
}
/* Stretched link: the whole card is the drink link; the heart sits above it */
.card-link { color: inherit; }
.card-link:hover { text-decoration: none; }
.card-link::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
.card-link:focus-visible { outline: none; }
.cocktail-card:has(.card-link:focus-visible) { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
.cocktail-meta {
    color: var(--text-muted); font-size: 0.75rem;
    display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem;
}
.cocktail-meta i { margin-right: 0.25rem; }
.cocktail-meta span {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: inline-flex; align-items: center;
}
.cocktail-ings { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.5rem; }
.tag {
    background: var(--bg-secondary); color: var(--text-secondary);
    padding: 0.15rem 0.5rem; border-radius: 6px; font-size: 0.7rem;
}
.tag.match { background: var(--accent-dim); color: var(--accent); font-weight: 600; }

.empty-state {
    text-align: center; padding: 2rem 1rem; color: var(--text-secondary);
}
.empty-state i { font-size: 2.5rem; color: var(--text-muted); margin-bottom: 0.85rem; }

/* ── Modal ── */
.modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 100;
    align-items: flex-start; justify-content: center;
    padding: 2rem 1rem; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal-content {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.75rem 1.5rem;
    max-width: 520px; width: 100%; position: relative; margin: auto 0;
}
.modal-close {
    position: absolute; top: 0.75rem; right: 0.75rem;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 8px; cursor: pointer; font-size: 1rem; transition: all 0.15s;
}
.modal-close:hover { border-color: var(--bad); color: var(--bad); }
.modal-content h2 {
    font-size: 1.4rem; margin-bottom: 0.5rem; padding-right: 2rem;
    display: flex; align-items: center; gap: 0.5rem;
}
.modal-content h2 i { color: var(--accent); }
.recipe-section { margin-top: 1.25rem; }
.recipe-section h4 {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 500;
}
.recipe-list { list-style: none; padding: 0; }
.recipe-list li {
    padding: 0.4rem 0; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 1rem; font-size: 0.9rem;
}
.recipe-list li:last-child { border-bottom: none; }
.recipe-list .qty { color: var(--text-secondary); font-weight: 600; min-width: 70px; }
.recipe-list .name { color: var(--text-primary); flex: 1; text-align: right; }
.recipe-line { color: var(--text-primary); font-size: 0.92rem; line-height: 1.7; }
.origin-note {
    margin-top: 1rem; padding: 0.75rem;
    background: var(--bg-card); border-radius: 8px;
    color: var(--text-secondary); font-size: 0.82rem; font-style: italic;
}

/* ── Toolbar above results ── */
.toolbar {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    margin-bottom: 0.85rem; align-items: center;
}
.toolbar .tb-search {
    flex: 1 1 220px; min-width: 180px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-primary); padding: 0.5rem 0.85rem;
    border-radius: 8px; font-family: inherit; font-size: 0.88rem;
}
.toolbar .tb-search:focus { outline: none; border-color: var(--accent); }
.toolbar .tb-search::placeholder { color: var(--text-muted); }
.toolbar select.tb-sort {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-primary); padding: 0.5rem 0.7rem;
    border-radius: 8px; font-family: inherit; font-size: 0.85rem; cursor: pointer;
}
.toolbar select.tb-sort:focus { outline: none; border-color: var(--accent); }
.icon-btn {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary);
    width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 0.95rem;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.view-toggle { display: inline-flex; gap: 0.25rem; }

/* Favorite heart on cards */
.fav-btn {
    position: absolute; top: 0.7rem; right: 0.7rem;
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 1rem; padding: 0.25rem;
    transition: all 0.15s; z-index: 2;
}
.fav-btn:hover { color: var(--accent); transform: scale(1.15); }
.fav-btn.active { color: var(--accent); }

/* Strength + classic badges */
.badge-row { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.4rem; }
.badge {
    font-size: 0.66rem; font-weight: 500;
    padding: 0.15rem 0.45rem; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.05em;
    border: 1px solid transparent;
}
.badge.light    { background: rgba(126, 219, 166, 0.15); color: var(--good); }
.badge.medium   { background: var(--accent-dim); color: var(--accent); }
.badge.zero     { background: rgba(126, 219, 166, 0.15); color: var(--good); }
.badge.stiff    { background: rgba(224, 122, 122, 0.15); color: var(--bad); }
.badge.template { background: var(--bg-secondary); color: var(--text-secondary); border-color: var(--border); }

/* List / compact view */
.results-list { display: flex; flex-direction: column; gap: 0.4rem; }
.results-list .cocktail-card {
    padding: 0.65rem 0.85rem; display: grid;
    grid-template-columns: 1fr auto auto; align-items: center; gap: 0.75rem;
}
.results-list .cocktail-card h3 { font-size: 0.95rem; margin: 0; padding: 0; }
.results-list .cocktail-card .cocktail-meta { margin: 0; font-size: 0.72rem; }
.results-list .cocktail-card .cocktail-ings,
.results-list .cocktail-card .badge-row { display: none; }
.results-list .list-badges { display: inline-flex; gap: 0.3rem; }
.results-list .fav-btn { position: relative; top: auto; right: auto; font-size: 1rem; }

/* Similar drinks in modal */
.similar-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.similar-chip {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-primary); padding: 0.35rem 0.7rem; border-radius: 999px;
    font-size: 0.8rem; cursor: pointer; transition: all 0.15s;
}
.similar-chip:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<nav class="navbar">
    <a class="brand" href="#/"><i class="fa-solid fa-martini-glass-citrus"></i> Next Round</a>
</nav>

<div class="container">
    <!-- Step 1: spirit landing -->
    <div id="spiritLanding">
        <div class="intro">
            <h1><i class="fa-solid fa-martini-glass-citrus"></i> What are you in the mood for?</h1>
            <p>Pick a base spirit and discover your next favorite drink — or search below if you already know.</p>
            <div class="landing-search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="landingSearch" class="landing-search" type="text" autocomplete="off" placeholder="Know what you want? Search by name or ingredient…">
                <button id="landingSearchClear" class="landing-search-clear" aria-label="Clear search" style="display:none"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="spirit-grid" id="spiritGrid"></div>
        <div id="landingResults" style="display:none"></div>
    </div>

    <!-- Step 2: sour vs stirred -->
    <div id="styleView" style="display:none">
        <div class="intro">
            <h1 id="styleHeader"><i class="fa-solid fa-martini-glass-citrus"></i> Bright or bold?</h1>
            <p>Pick a vibe — or skip and see them all.</p>
        </div>
        <div class="spirit-grid style-grid" id="styleGrid"></div>
        <div class="style-skip">
            <button class="nav-btn" id="styleSkip"><i class="fa-solid fa-list"></i> Show me both — see all <span id="styleAllCount"></span></button>
            <button class="nav-btn" id="styleBack"><i class="fa-solid fa-arrow-left"></i> Change spirit</button>
        </div>
    </div>

    <!-- Step 3: results + narrow-down panel -->
    <div id="resultsView" style="display:none">
        <div class="results-header">
            <button class="nav-btn" id="changeSpirit"><i class="fa-solid fa-arrow-left"></i> Change spirit</button>
            <div class="spirit-title" id="spiritTitle"></div>
            <button class="nav-btn" id="styleChip" title="Change style"></button>
            <button class="nav-btn surprise" id="surpriseBtn" title="Random pick"><i class="fa-solid fa-dice"></i> Surprise me</button>
        </div>

        <div class="results-layout">
            <!-- Collapsible ingredient filter (sidebar on desktop, bottom sheet on mobile) -->
            <aside class="filter-sidebar" id="filterSidebar">
                <div class="filter-head">
                    <i class="fa-solid fa-flask"></i> Refine
                    <span id="selectedCount">0 selected</span>
                    <button class="filter-close" id="filterClose" aria-label="Close filters"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <input class="search-input" id="ingSearch" type="text" placeholder="Search ingredients...">
                <div id="ingredientCats"></div>
                <div class="filter-actions">
                    <button class="clear-btn" id="filterClear">Clear</button>
                    <button class="filter-apply" id="filterApply">Show <span id="filterApplyCount">0</span> drinks</button>
                </div>
            </aside>
            <div class="filter-backdrop" id="filterBackdrop"></div>

            <div class="results-main">
                <div class="toolbar">
                    <button class="icon-btn" id="filterToggle" title="Filter by ingredient"><i class="fa-solid fa-flask"></i> Filter by ingredient <span class="filter-count-badge" id="filterCountBadge" style="display:none">0</span></button>
                    <input class="tb-search" id="nameSearch" type="text" placeholder="Search by name…">
                    <button class="icon-btn" id="favFilterBtn" title="Favorites only"><i class="fa-regular fa-heart"></i></button>
                    <div class="view-toggle">
                        <button class="icon-btn active" id="viewGrid" title="Grid view"><i class="fa-solid fa-grip"></i></button>
                        <button class="icon-btn" id="viewList" title="List view"><i class="fa-solid fa-list"></i></button>
                    </div>
                </div>

                <div class="panel">
                    <h2><i class="fa-solid fa-list"></i> Order this <span class="count" id="resultCount">0</span></h2>
                    <div class="results-summary" id="resultsSummary"></div>
                    <div id="results"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Recipe modal -->
<div class="modal-overlay" id="recipeModal">
    <div class="modal-content" id="recipeContent"></div>
</div>

<script>
(() => {
'use strict';

const CATEGORY_ORDER = ['spirit', 'liqueur', 'amaro', 'fortified', 'citrus', 'sweetener', 'bitters', 'herb', 'other'];
const CATEGORY_LABELS = {
    spirit: 'Spirits',
    liqueur: 'Liqueurs',
    amaro: 'Amari & Apéritifs',
    fortified: 'Vermouth, Sherry & Wine',
    citrus: 'Citrus & Juice',
    sweetener: 'Sweeteners & Syrups',
    bitters: 'Bitters',
    herb: 'Herbs',
    other: 'Other',
};

// Landing cards. Which drinks sit on each card comes from each drink's `base` in
// cocktails-data.js; `keys` are the ingredients highlighted as "the spirit" on cards
// and left out of the refine panel.
const SPIRIT_GROUPS = [
    { id: 'gin',      label: 'Gin',                icon: 'fa-glass-water',         desc: 'Crisp, botanical, herbal',            keys: ['gin', 'old_tom_gin', 'navy_gin', 'genever'] },
    { id: 'whiskey',  label: 'Whiskey',            icon: 'fa-fire',                desc: 'Bourbon, rye, scotch, irish',         keys: ['bourbon', 'rye', 'scotch', 'peated_scotch', 'irish_whiskey', 'japanese_whisky'] },
    { id: 'tequila',  label: 'Tequila & Mezcal',   icon: 'fa-pepper-hot',          desc: 'Bright agave or smoky',               keys: ['tequila', 'reposado_tequila', 'anejo_tequila', 'mezcal'] },
    { id: 'rum',      label: 'Rum',                icon: 'fa-umbrella-beach',      desc: 'Tropical, funky, tiki',               keys: ['rum', 'white_rum', 'aged_rum', 'black_rum', 'jamaican_rum', 'cachaca', 'agricole', 'arrack'] },
    { id: 'vodka',    label: 'Vodka',              icon: 'fa-snowflake',           desc: 'Clean and easy-going',                keys: ['vodka'] },
    { id: 'brandy',   label: 'Brandy',             icon: 'fa-wine-bottle',         desc: 'Cognac, apple brandy, pisco',         keys: ['cognac', 'brandy', 'pisco', 'apple_brandy'] },
    { id: 'lowabv',   label: 'Low & No ABV',       icon: 'fa-leaf',                desc: 'Vermouth, sherry, amaro, zero-proof', keys: ['dry_vermouth', 'sweet_vermouth', 'blanc_vermouth', 'vermouth', 'sherry', 'lillet_blanc', 'lillet_rouge', 'cocchi_americano', 'cocchi', 'campari', 'aperol', 'cynar', 'fernet', 'montenegro', 'cio_ciaro', 'china_china', 'suze', 'amaro', 'punt_e_mes', 'nonino', 'ramazzotti'] },
    { id: 'aquavit',  label: 'Aquavit & Absinthe', icon: 'fa-wand-magic-sparkles', desc: 'Caraway, anise, Chartreuse',          keys: ['aquavit', 'absinthe'] },
    { id: 'surprise', label: 'Surprise me',        icon: 'fa-dice',                desc: 'Pick something at random',            keys: [], surprise: true },
];
const ANY_SPIRIT = 'any_spirit';   // template drinks (Collins, Fix, …) — highlighted under every spirit

const STYLES = [
    { id: 'bright', label: 'Bright', icon: 'fa-sun',  desc: 'Refreshing, citrusy, and light. Think Margaritas and Daiquiris.' },
    { id: 'bold',   label: 'Bold',   icon: 'fa-fire', desc: 'Rich, spirit-forward, and strong. Think Old Fashioneds and Manhattans.' },
];

const STRENGTH_LABELS = { zero: 'Zero proof', light: 'Low ABV', medium: 'Medium', stiff: 'Strong' };

const state = {
    cocktails: [],
    ingredients: [],
    bySlug: new Map(),
    screen: null,           // 'landing' | 'style' | 'results' — mirrors the URL hash
    spirit: null,           // selected SPIRIT_GROUPS entry
    style: null,            // 'bright' | 'bold' | null (= both)
    recipe: null,           // cocktail open in the recipe modal
    selected: new Set(),    // refinement: extra required ingredients
    search: '',
    nameSearch: '',
    view: 'grid',           // 'grid' | 'list'
    favsOnly: false,
    favorites: new Set(JSON.parse(localStorage.getItem('cp_favs') || '[]')),
};

function saveFavorites() {
    localStorage.setItem('cp_favs', JSON.stringify([...state.favorites]));
}
function toggleFavorite(name) {
    if (state.favorites.has(name)) state.favorites.delete(name);
    else state.favorites.add(name);
    saveFavorites();
    if (state.screen === 'results') renderResults();
    if (state.screen === 'landing') renderLandingSearch(landingSearchEl.value);
    if (state.recipe) renderRecipe(state.recipe);
}

// ── Strength ──
function ozOf(qty) {
    if (!qty) return 0;
    const s = String(qty).toLowerCase();
    if (!/oz/.test(s)) return 0;
    // strip "oz" and everything after; grab the leading number/fraction
    const num = s.replace(/oz.*$/, '').trim();
    // handle mixed like "1 1/2" and plain fractions "3/4"
    const m = num.match(/^(\d+)?\s*(?:(\d+)\/(\d+))?$/);
    if (!m) { const f = parseFloat(num); return isFinite(f) ? f : 0; }
    const whole = m[1] ? parseFloat(m[1]) : 0;
    const frac = m[2] && m[3] ? parseFloat(m[2]) / parseFloat(m[3]) : 0;
    return whole + frac;
}
function strengthOf(c) {
    // Weighted alcohol oz: estimate how much pure ethanol is in the drink.
    // Spirits ~40% ABV (1.0), liqueurs/amari ~25% (0.65), fortified wines ~17% (0.4).
    const WEIGHT = { spirit: 1.0, liqueur: 0.65, amaro: 0.65, fortified: 0.4 };
    let alc = 0;
    c.ingredients.forEach(i => {
        const w = WEIGHT[i.category];
        if (w) alc += ozOf(i.qty) * w;
    });
    const tier = alc === 0 ? 'zero' : alc <= 1.2 ? 'light' : alc >= 2.4 ? 'stiff' : 'medium';
    return { tier, alc: Math.round(alc * 100) / 100 };
}

// ── Filtering ──
const inGroup = (c, group) => c.base.includes(group.id);
const matchesStyle = (c, style) => !style || c.style === style;
function hasAll(c, keys) {
    for (const k of keys) if (!c.keys.has(k)) return false;
    return true;
}
// Current spirit + style, narrowed by the ingredients picked in the refine panel
function refinedPool() {
    return state.cocktails.filter(c => inGroup(c, state.spirit) && matchesStyle(c, state.style) && hasAll(c, state.selected));
}
function spiritKeys() {
    return new Set([...state.spirit.keys, ANY_SPIRIT]);
}
function randomItem(list) {
    return list[Math.floor(Math.random() * list.length)];
}
function slugify(s) {
    return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
        .replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// ── Load data ──
// Data is embedded via <script src="cocktails-data.js"> so this works on file:// too.
function loadData() {
    const data = window.COCKTAIL_DATA;
    if (!data) throw new Error('cocktails-data.js did not load');
    state.cocktails = data.cocktails;
    state.ingredients = data.ingredients;
    state.cocktails.forEach(c => {
        c.keys = new Set(c.ingredients.map(i => i.key));
        c.strength = strengthOf(c);
        let slug = slugify(c.name);
        for (let n = 2; state.bySlug.has(slug); n++) slug = `${slugify(c.name)}-${n}`;
        c.slug = slug;
        state.bySlug.set(slug, c);
    });
    renderSpiritLanding();
    route();
}

// ── Routing ──
// The URL hash mirrors where you are, so the back button works and any drink can be linked:
//   #/  →  #/gin  →  #/gin/bright (or /bold, /all)  →  #/gin/bright?drink=aviation
let recipePushed = false;   // the open recipe has its own history entry, so closing = going back

function viewPath() {
    if (state.screen === 'results') return `/${state.spirit.id}/${state.style || 'all'}`;
    if (state.screen === 'style') return `/${state.spirit.id}`;
    return '/';
}
function drinkHref(c) {
    return `#${viewPath()}?drink=${c.slug}`;
}
function go(hash, { replace = false } = {}) {
    if (replace) { history.replaceState(null, '', hash); route(); }
    else if (location.hash !== hash) location.hash = hash;   // fires hashchange → route()
}
function route(fromHashChange = false) {
    const [path, query = ''] = location.hash.replace(/^#/, '').split('?');
    const [spiritId, styleId] = path.split('/').filter(Boolean);
    const group = SPIRIT_GROUPS.find(g => g.id === spiritId && !g.surprise);
    if (!group) showLanding();
    else if (styleId === 'all' || STYLES.some(s => s.id === styleId)) showResults(group, styleId === 'all' ? null : styleId);
    else showStyleStep(group);

    const drink = state.bySlug.get(new URLSearchParams(query).get('drink'));
    if (drink) {
        if (!state.recipe) recipePushed = fromHashChange;
        openRecipe(drink);
    } else {
        recipePushed = false;
        hideRecipe();
    }
}
function closeRecipe() {
    if (recipePushed) history.back();
    else go('#' + viewPath(), { replace: true });
}
window.addEventListener('hashchange', () => route(true));

function showScreen(screen) {
    state.screen = screen;
    document.getElementById('spiritLanding').style.display = screen === 'landing' ? 'block' : 'none';
    document.getElementById('styleView').style.display = screen === 'style' ? 'block' : 'none';
    document.getElementById('resultsView').style.display = screen === 'results' ? 'block' : 'none';
    window.scrollTo(0, 0);
}

// ── Cards (landing search + results) ──
function favButtonHtml(c, attrs = '') {
    const on = state.favorites.has(c.name);
    return `<button type="button" class="fav-btn${on ? ' active' : ''}" data-fav="${escapeHtml(c.name)}" aria-pressed="${on}" title="${on ? 'Remove from favorites' : 'Add to favorites'}"${attrs}><i class="${on ? 'fa-solid' : 'fa-regular'} fa-heart"></i></button>`;
}
function badgesHtml(c, { always = false } = {}) {
    const { tier, alc } = c.strength;
    const out = [];
    if (c.template) out.push('<span class="badge template"><i class="fa-solid fa-shuffle"></i> Any spirit</span>');
    // Cards only show the *interesting* strength signals: Zero, Low ABV or Strong (skip Medium)
    if (always || tier !== 'medium') {
        out.push(`<span class="badge ${tier}"><i class="fa-solid fa-bolt"></i> ${STRENGTH_LABELS[tier]}${tier === 'zero' ? '' : ` · ${alc} oz`}</span>`);
    }
    return out.join('');
}
// highlight(i): light up this ingredient tag; rank(i): sort order of tags (low first)
function cardHtml(c, { list = false, highlight = () => false, rank = () => 0 } = {}) {
    const link = `<a class="card-link" href="${drinkHref(c)}">${escapeHtml(c.name)}</a>`;
    const meta = `<div class="cocktail-meta">${c.glass ? `<span><i class="fa-solid fa-wine-glass"></i>${escapeHtml(c.glass)}</span>` : ''}</div>`;
    const badges = badgesHtml(c);
    if (list) {
        return `<div class="cocktail-card">
            <div><h3>${link}</h3>${meta}</div>
            <span class="list-badges">${badges}</span>
            ${favButtonHtml(c)}
        </div>`;
    }
    const tags = c.ingredients.slice().sort((a, b) => rank(a) - rank(b))
        .map(i => `<span class="tag${highlight(i) ? ' match' : ''}">${escapeHtml(i.display)}</span>`).join('');
    return `<div class="cocktail-card">
        ${favButtonHtml(c)}
        <h3>${link}</h3>
        ${badges ? `<div class="badge-row">${badges}</div>` : ''}
        ${meta}
        <div class="cocktail-ings">${tags}</div>
    </div>`;
}
function onCardListClick(e) {
    const fav = e.target.closest('.fav-btn');
    if (fav) toggleFavorite(fav.dataset.fav);
}

// ── Step 1: spirit landing ──
function showLanding() {
    if (state.screen === 'landing') return;
    const firstLoad = state.screen === null;
    state.spirit = null;
    state.style = null;
    showScreen('landing');
    if (!firstLoad) { landingSearchEl.value = ''; renderLandingSearch(''); }
}

function renderSpiritLanding() {
    document.getElementById('spiritGrid').innerHTML = SPIRIT_GROUPS.map(g => {
        const n = g.surprise ? state.cocktails.length : state.cocktails.filter(c => inGroup(c, g)).length;
        const inner = `<div class="icon"><i class="fa-solid ${g.icon}"></i></div>
            <h3>${escapeHtml(g.label)}</h3>
            <div class="desc">${escapeHtml(g.desc)}</div>
            <div class="count-pill">${n} drink${n === 1 ? '' : 's'}</div>`;
        return g.surprise
            ? `<button type="button" class="spirit-card" data-surprise>${inner}</button>`
            : `<a class="spirit-card" href="#/${g.id}">${inner}</a>`;
    }).join('');
}

// ── Direct search from the landing page (for when you already know the drink) ──
function renderLandingSearch(query) {
    const results = document.getElementById('landingResults');
    const q = query.trim().toLowerCase();
    document.getElementById('spiritGrid').style.display = q ? 'none' : '';
    document.getElementById('landingSearchClear').style.display = q ? '' : 'none';
    results.style.display = q ? 'block' : 'none';
    if (!q) { results.innerHTML = ''; return; }

    // Rank: name-prefix match, then name-contains, then ingredient-only match
    const ingHit = i => [i.display, i.name].some(s => s && s.toLowerCase().includes(q));
    const scored = [];
    state.cocktails.forEach(c => {
        const nameLc = c.name.toLowerCase();
        const nameHit = nameLc.includes(q);
        if (!nameHit && !c.ingredients.some(ingHit)) return;
        scored.push({ c, nameHit, score: nameLc.startsWith(q) ? 0 : (nameHit ? 1 : 2) });
    });
    scored.sort((a, b) => a.score - b.score || a.c.name.localeCompare(b.c.name));

    const niceQ = escapeHtml(query.trim());
    if (scored.length === 0) {
        results.innerHTML = `<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i><div>No drinks match “${niceQ}”.</div><div style="font-size:0.85rem;margin-top:0.4rem">Try a different name or ingredient — or pick a spirit above.</div></div>`;
        return;
    }
    results.innerHTML =
        `<div class="results-summary"><strong>${scored.length}</strong> drink${scored.length === 1 ? '' : 's'} match “${niceQ}”. Tap any to see the recipe.</div>` +
        `<div class="results-grid">${scored.map(({ c, nameHit }) => cardHtml(c, { highlight: i => !nameHit && ingHit(i) })).join('')}</div>`;
}

// ── Step 2: bright vs bold ──
function showStyleStep(group) {
    if (state.screen === 'style' && state.spirit === group) return;
    state.spirit = group;
    state.style = null;
    const pool = state.cocktails.filter(c => inGroup(c, group));
    document.getElementById('styleHeader').innerHTML =
        `<i class="fa-solid ${group.icon}"></i> ${escapeHtml(group.label)} — bright or bold?`;
    document.getElementById('styleGrid').innerHTML = STYLES.map(s => {
        const n = pool.filter(c => c.style === s.id).length;
        return `<a class="spirit-card" href="#/${group.id}/${s.id}">
            <div class="icon"><i class="fa-solid ${s.icon}"></i></div>
            <h3>${escapeHtml(s.label)}</h3>
            <div class="desc">${escapeHtml(s.desc)}</div>
            <div class="count-pill">${n} drink${n === 1 ? '' : 's'}</div>
        </a>`;
    }).join('');
    document.getElementById('styleAllCount').textContent = `(${pool.length})`;
    showScreen('style');
}

// ── Step 3: results + refine panel ──
function showResults(group, style) {
    if (state.screen === 'results' && state.spirit === group && state.style === style) return;
    state.spirit = group;
    state.style = style;
    state.selected.clear();
    state.search = '';
    state.nameSearch = '';
    state.favsOnly = false;
    document.getElementById('ingSearch').value = '';
    document.getElementById('nameSearch').value = '';
    document.getElementById('favFilterBtn').classList.remove('active');
    applyFilterDefault();

    document.getElementById('spiritTitle').innerHTML =
        `<i class="fa-solid ${group.icon}"></i> ${escapeHtml(group.label)}`;
    renderStyleChip();
    showScreen('results');
    renderIngredients();
    renderResults();
}

function renderStyleChip() {
    const chip = document.getElementById('styleChip');
    if (!state.style) {
        chip.innerHTML = `<i class="fa-solid fa-list"></i> Both styles`;
    } else {
        const s = STYLES.find(x => x.id === state.style);
        chip.innerHTML = `<i class="fa-solid ${s.icon}"></i> ${escapeHtml(s.label)} <i class="fa-solid fa-pen-to-square" style="opacity:0.5;font-size:0.75em;margin-left:0.25rem"></i>`;
    }
}

// ── Render ingredient picker (grouped by category) ──
function renderIngredients() {
    const root = document.getElementById('ingredientCats');
    const search = state.search.toLowerCase();

    // Ingredients that appear in the already-narrowed pool, so every extra pill
    // the user taps is guaranteed to lead to at least one remaining drink.
    const hidden = spiritKeys();
    const usage = {};
    refinedPool().forEach(c => {
        c.keys.forEach(k => { if (!hidden.has(k)) usage[k] = (usage[k] || 0) + 1; });
    });
    // Always keep already-selected ingredients visible so the user can deselect them.
    state.selected.forEach(k => { if (!usage[k]) usage[k] = 0; });

    const grouped = {};
    state.ingredients.forEach(ing => {
        if (!(ing.key in usage)) return;
        if (search && !ing.display.toLowerCase().includes(search)) return;
        (grouped[ing.category] = grouped[ing.category] || []).push(ing);
    });

    const html = CATEGORY_ORDER
        .filter(cat => grouped[cat] && grouped[cat].length)
        .map(cat => {
            const items = grouped[cat]
                .sort((a, b) => usage[b.key] - usage[a.key])
                .map(ing => {
                    const sel = state.selected.has(ing.key) ? 'selected' : '';
                    return `<span class="ing-pill ${sel}" data-key="${ing.key}">${escapeHtml(ing.display)} <span class="qty">${usage[ing.key]}</span></span>`;
                }).join('');
            return `<div class="ingredient-cat">
                <div class="ingredient-cat-title">${CATEGORY_LABELS[cat] || cat}</div>
                <div class="ingredient-list">${items}</div>
            </div>`;
        }).join('');

    root.innerHTML = html || '<div class="empty-state" style="padding:1rem"><div>No ingredients match.</div></div>';
    document.getElementById('selectedCount').textContent = state.selected.size + ' selected';
}

function renderResults() {
    const root = document.getElementById('results');
    const summary = document.getElementById('resultsSummary');

    let pool = refinedPool();
    if (state.nameSearch) {
        const q = state.nameSearch.toLowerCase();
        pool = pool.filter(c => c.name.toLowerCase().includes(q));
    }
    if (state.favsOnly) pool = pool.filter(c => state.favorites.has(c.name));
    pool.sort((a, b) => a.name.localeCompare(b.name));
    document.getElementById('resultCount').textContent = pool.length;
    updateFilterUI(pool.length);

    const styleLabel = state.style ? STYLES.find(s => s.id === state.style).label.toLowerCase() : '';
    const niceLabel = escapeHtml(state.spirit.label) + (styleLabel ? ` ${styleLabel}` : '');
    const drinks = `<strong>${pool.length}</strong> ${niceLabel} drink${pool.length === 1 ? '' : 's'}`;
    if (state.selected.size === 0) {
        summary.innerHTML = `${drinks}. Tap any to see the recipe.`;
    } else {
        const selNames = [...state.selected].map(k => state.ingredients.find(i => i.key === k)?.display).filter(Boolean).join(', ');
        summary.innerHTML = `${drinks} also with: ${escapeHtml(selNames)} <button type="button" class="clear-btn" data-clear-filters><i class="fa-solid fa-xmark"></i> Clear filters</button>`;
    }

    if (pool.length === 0) {
        root.innerHTML = '<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i><div>Nothing matches that combo. Try removing a filter.</div></div>';
        return;
    }
    const keys = spiritKeys();
    const rank = i => keys.has(i.key) ? 0 : (state.selected.has(i.key) ? 1 : 2);
    const list = state.view === 'list';
    root.innerHTML = `<div class="${list ? 'results-list' : 'results-grid'}">` +
        pool.map(c => cardHtml(c, { list, rank, highlight: i => rank(i) < 2 })).join('') + '</div>';
}

function clearSelected() {
    state.selected.clear();
    renderIngredients();
    renderResults();
}

// ── Recipe modal ──
function openRecipe(c) {
    if (state.recipe !== c) document.getElementById('recipeModal').scrollTop = 0;
    state.recipe = c;
    renderRecipe(c);
    document.getElementById('recipeModal').classList.add('open');
    document.title = `${c.name} · Next Round`;
}
function hideRecipe() {
    if (!state.recipe) return;
    state.recipe = null;
    document.getElementById('recipeModal').classList.remove('open');
    document.title = 'Next Round';
}
function renderRecipe(c) {
    const ingHtml = c.ingredients.map(i => {
        const isSel = state.selected.has(i.key);
        return `<li>
            <span class="qty">${escapeHtml(i.qty || '')}</span>
            <span class="name" style="${isSel ? 'color:var(--accent);font-weight:600' : ''}">${escapeHtml(i.name)}</span>
        </li>`;
    }).join('');
    // Similar drinks: share ≥2 ingredients
    const similar = state.cocktails
        .filter(x => x !== c)
        .map(x => {
            let overlap = 0;
            x.keys.forEach(k => { if (c.keys.has(k)) overlap++; });
            return { c: x, overlap };
        })
        .filter(x => x.overlap >= 2)
        .sort((a, b) => b.overlap - a.overlap || a.c.name.localeCompare(b.c.name))
        .slice(0, 6);

    document.getElementById('recipeContent').innerHTML = `
        <button type="button" class="modal-close" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <h2><i class="fa-solid fa-martini-glass-citrus"></i> ${escapeHtml(c.name)}
            ${favButtonHtml(c, ' style="position:static;margin-left:auto;font-size:1.2rem"')}
        </h2>
        <div class="badge-row" style="margin-bottom:0.75rem">${badgesHtml(c, { always: true })}</div>
        <div class="recipe-section">
            <h4>Ingredients</h4>
            <ul class="recipe-list">${ingHtml}</ul>
        </div>
        ${c.method ? `<div class="recipe-section"><h4>Method</h4><div class="recipe-line">${escapeHtml(c.method)}</div></div>` : ''}
        ${c.glass ? `<div class="recipe-section"><h4>Glass</h4><div class="recipe-line">${escapeHtml(c.glass)}</div></div>` : ''}
        ${c.garnish ? `<div class="recipe-section"><h4>Garnish</h4><div class="recipe-line">${escapeHtml(c.garnish)}</div></div>` : ''}
        ${c.notes ? `<div class="recipe-section"><h4>Notes</h4><div class="recipe-line">${escapeHtml(c.notes)}</div></div>` : ''}
        ${c.origin ? `<div class="origin-note"><strong>Origin:</strong> ${escapeHtml(c.origin)}</div>` : ''}
        ${similar.length ? `<div class="recipe-section">
            <h4>If you like this, try</h4>
            <div class="similar-row">${similar.map(s => `<a class="similar-chip" href="${drinkHref(s.c)}">${escapeHtml(s.c.name)}</a>`).join('')}</div>
        </div>` : ''}
    `;
}

document.getElementById('recipeContent').addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) { closeRecipe(); return; }
    const fav = e.target.closest('.fav-btn');
    if (fav) { toggleFavorite(fav.dataset.fav); return; }
    const chip = e.target.closest('.similar-chip');
    if (chip && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
        e.preventDefault();
        go(chip.getAttribute('href'), { replace: true });   // swap drinks without stacking history
    }
});
document.getElementById('recipeModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('recipeModal')) closeRecipe();
});
document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (state.recipe) { closeRecipe(); return; }
    if (document.getElementById('resultsView').classList.contains('filter-open')) closeFilter();
});

// ── Navigation buttons ──
document.getElementById('changeSpirit').addEventListener('click', () => go('#/'));
document.getElementById('styleBack').addEventListener('click', () => go('#/'));
document.getElementById('styleChip').addEventListener('click', () => go(`#/${state.spirit.id}`));
document.getElementById('styleSkip').addEventListener('click', () => go(`#/${state.spirit.id}/all`));
document.getElementById('surpriseBtn').addEventListener('click', () => {
    const pool = state.cocktails.filter(c => inGroup(c, state.spirit) && matchesStyle(c, state.style));
    if (pool.length) go(drinkHref(randomItem(pool)));
});
document.getElementById('spiritGrid').addEventListener('click', (e) => {
    if (e.target.closest('[data-surprise]') && state.cocktails.length) go(drinkHref(randomItem(state.cocktails)));
});

// ── Landing search (direct recipe lookup) ──
const landingSearchEl = document.getElementById('landingSearch');
landingSearchEl.addEventListener('input', (e) => renderLandingSearch(e.target.value));
landingSearchEl.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && landingSearchEl.value) {
        e.stopPropagation();
        landingSearchEl.value = '';
        renderLandingSearch('');
    }
});
document.getElementById('landingSearchClear').addEventListener('click', () => {
    landingSearchEl.value = '';
    renderLandingSearch('');
    landingSearchEl.focus();
});
document.getElementById('landingResults').addEventListener('click', onCardListClick);

// ── Results ──
document.getElementById('results').addEventListener('click', onCardListClick);
document.getElementById('resultsSummary').addEventListener('click', (e) => {
    if (e.target.closest('[data-clear-filters]')) clearSelected();
});
document.getElementById('ingredientCats').addEventListener('click', (e) => {
    const pill = e.target.closest('.ing-pill');
    if (!pill) return;
    const k = pill.dataset.key;
    if (state.selected.has(k)) state.selected.delete(k);
    else state.selected.add(k);
    renderIngredients();
    renderResults();
});
document.getElementById('ingSearch').addEventListener('input', (e) => {
    state.search = e.target.value;
    renderIngredients();
});

// ── Toolbar ──
document.getElementById('nameSearch').addEventListener('input', (e) => {
    state.nameSearch = e.target.value;
    renderResults();
});
document.getElementById('favFilterBtn').addEventListener('click', () => {
    state.favsOnly = !state.favsOnly;
    document.getElementById('favFilterBtn').classList.toggle('active', state.favsOnly);
    renderResults();
});
function setView(view) {
    state.view = view;
    document.getElementById('viewGrid').classList.toggle('active', view === 'grid');
    document.getElementById('viewList').classList.toggle('active', view === 'list');
    renderResults();
}
document.getElementById('viewGrid').addEventListener('click', () => setView('grid'));
document.getElementById('viewList').addEventListener('click', () => setView('list'));

// ── Ingredient filter (collapsible sidebar / mobile sheet) ──
// Default: open on desktop (discoverable), closed on mobile (it's a sheet).
// The user's desktop choice is remembered so closing it sticks across visits.
const FILTER_PREF_KEY = 'cp_filter_open';
const mqFilterDesktop = window.matchMedia('(min-width: 761px)');
function setFilterOpen(open, persist) {
    document.getElementById('resultsView').classList.toggle('filter-open', open);
    if (persist && mqFilterDesktop.matches) {
        localStorage.setItem(FILTER_PREF_KEY, open ? 'open' : 'closed');
    }
}
function closeFilter() { setFilterOpen(false, false); }
function toggleFilter() {
    const isOpen = document.getElementById('resultsView').classList.contains('filter-open');
    setFilterOpen(!isOpen, true);   // explicit user intent — persist (desktop only)
}
function applyFilterDefault() {
    if (!mqFilterDesktop.matches) { setFilterOpen(false, false); return; }  // mobile: always start closed
    const pref = localStorage.getItem(FILTER_PREF_KEY);
    setFilterOpen(pref ? pref === 'open' : true, false);                    // desktop: open unless previously closed
}
mqFilterDesktop.addEventListener('change', (e) => {
    if (e.matches) applyFilterDefault(); else setFilterOpen(false, false);  // keep the sheet from being stuck open on shrink
});
function updateFilterUI(resultCountVal) {
    const n = state.selected.size;
    const badge = document.getElementById('filterCountBadge');
    badge.style.display = n ? '' : 'none';
    badge.textContent = n;
    document.getElementById('filterToggle').classList.toggle('has-filters', n > 0);
    document.getElementById('filterApplyCount').textContent = resultCountVal;
}
document.getElementById('filterToggle').addEventListener('click', toggleFilter);
document.getElementById('filterClose').addEventListener('click', closeFilter);
document.getElementById('filterBackdrop').addEventListener('click', closeFilter);
document.getElementById('filterApply').addEventListener('click', closeFilter);
document.getElementById('filterClear').addEventListener('click', clearSelected);

// ── Util ──
function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

try {
    loadData();
} catch (err) {
    const msg = `Failed to load cocktail data: ${escapeHtml(err.message)}. Make sure <code>cocktails-data.js</code> is next to this HTML file.`;
    document.getElementById('spiritLanding').innerHTML = `<div class="intro"><h1><i class="fa-solid fa-circle-exclamation"></i> Can't load cocktails</h1><p style="margin-top:0.5rem">${msg}</p></div>`;
}

})();
</script>
</body>
</html>
