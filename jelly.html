function howTo(back) {
    modal(`<h2>How to play</h2>
        <ul>
            <li><b>Tap a jelly</b> at the front of a line. It hops on the track and skates around the picture.</li>
            <li>As it skates, it shoots the first cube it sees in each row and column, <b>if that cube is its color</b>. Its number is how many shots it has left.</li>
            <li>A jelly with shots left after a lap <b>waits in a slot</b>. Tap it to send it again.</li>
            <li>If a jelly comes back and every slot is full, you're <b>out of room</b>.</li>
            <li>Up to 5 jellies fit on the track at once. Bust every cube to finish the picture.</li>
        </ul>
        <p><i class="fa-solid fa-hammer"></i> smashes a 3 by 3 patch and <i class="fa-solid fa-magnet"></i> pulls any jelly to the front. From level 8 you get 4 slots; run out of room and you can buy a fifth once a level.</p>
        <div class="acts"><button class="btn" data-act="ok">Let's play</button></div>`, {ok: back || closeModal});
}

function modal(html, acts) {
    stopScan();
    const card = $('card');
    card.innerHTML = html;
    $('modal').hidden = false;
    modalOpen = true;
    card.onclick = e => {
        const b = e.target.closest('[data-act]');
        if (b && acts[b.dataset.act]) { audio(); acts[b.dataset.act](b); }
    };
}
function closeModal() { stopScan(); $('modal').hidden = true; modalOpen = false; }

let toastTimer = 0;
function toast(text) {
    const el = $('toast');
    el.textContent = text; el.hidden = false;
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

/* ---------- moving progress between devices ---------- */
// Progress packs into a 15 character code, so no server is needed: level, coins,
// boosters, streaks and two settings, plus a check against typos. The album and the
// tips that have been seen follow from the level. A level partway through starts over.
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';   // no I, L, O or U to misread
const MOVE_FIELDS = [['v', 2], ['lvl', 14], ['coins', 17], ['hammer', 6], ['magnet', 6], ['streak', 8], ['best', 9], ['sound', 1], ['fast', 1]];
const moveSum = str => { let h = 7; for (const ch of str) h = (h * 31 + B32.indexOf(ch)) % 1021; return h; };
function moveCode(sv) {
    const vals = {v: 1, lvl: sv.lvl, coins: sv.coins, hammer: sv.boost.hammer, magnet: sv.boost.magnet, streak: sv.streak, best: sv.best, sound: +!!sv.sound, fast: +!!sv.fast};
    let bits = '';
    for (const [k, n] of MOVE_FIELDS) bits += clamp(Math.floor(vals[k] || 0), 0, 2 ** n - 1).toString(2).padStart(n, '0');
    while (bits.length % 5) bits += '0';
    let out = '';
    for (let i = 0; i < bits.length; i += 5) out += B32[parseInt(bits.slice(i, i + 5), 2)];
    const sum = moveSum(out);
    return (out + B32[sum >> 5] + B32[sum & 31]).replace(/(.{5})(?=.)/g, '$1-');
}
function readMove(text) {
    const str = String(text || '').split('#move=').pop().toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '');
    if (str.length !== 15) return null;
    const body = str.slice(0, 13), sum = moveSum(body);
    if (str[13] !== B32[sum >> 5] || str[14] !== B32[sum & 31]) return null;
    let bits = '';
    for (const ch of body) { const v = B32.indexOf(ch); if (v < 0) return null; bits += v.toString(2).padStart(5, '0'); }
    const m = {};
    let at = 0;
    for (const [k, n] of MOVE_FIELDS) { m[k] = parseInt(bits.slice(at, at + n), 2); at += n; }
    return m.v === 1 && m.lvl >= 1 ? m : null;
}
function applyMove(m) {
    const tips = {...save.tips}, seen = (id, lvl) => { if (m.lvl > lvl) tips[id] = 1; };
    ['tap', 'shoot', 'slots', 'cap'].forEach(id => seen(id, 3));
    seen('u_hammer', UNLOCK.hammer); seen('u_magnet', UNLOCK.magnet);
    for (let n = 1; n < Math.min(m.lvl, 80); n++) {
        const info = levelInfo(n);
        if (info.hard) tips.u_hard = 1;
        if (info.hidden) tips.u_hidden = 1;
        if (info.ice) tips.u_ice = 1;
    }
    const album = {};
    PICS.forEach((p, k) => { if (k + 1 < m.lvl) album[p.id] = k + 1; });
    save = {...JSON.parse(JSON.stringify(DEF)), lvl: m.lvl, coins: m.coins, boost: {hammer: m.hammer, magnet: m.magnet},
        streak: m.streak, best: Math.max(m.best, m.streak), wins: m.lvl - 1, album, tips, sound: !!m.sound, fast: !!m.fast};
    G = null; loadingN = 0;
    persist();
    closeModal();
    show('home');
    toast(`Welcome back: level ${m.lvl}!`);
}
const moveSummary = sv => `Level ${sv.lvl}, ${sv.coins} coins`;

function moveMenu(back) {
    const code = moveCode(save), link = location.href.split('#')[0].split('?')[0] + '#move=' + code;
    modal(`<h2>Move your progress</h2>
        <p>This device: <b>${moveSummary(save)}</b></p>
        <div class="move-box">
            <div class="lbl">Your code</div>
            <div class="move-code">${code}</div>
            <button class="btn white" data-act="copy"><i class="fa-regular fa-copy"></i> Copy</button>
            <canvas id="moveQR" hidden></canvas>
            <p class="small" style="margin:.5rem 0 0">On the other device, scan this with the camera, or open Jelly Jam there, go to Settings, Move to another device, and enter the code.</p>
        </div>
        <div class="acts">
            <button class="btn purple" data-act="enter"><i class="fa-solid fa-download"></i> Bring progress here</button>
            <button class="link" data-act="back">Done</button>
        </div>
        <p class="small">A level you're partway through starts over on the other device.</p>`, {
        copy: b => {
            const ok = () => { b.innerHTML = '<i class="fa-solid fa-check"></i> Copied'; };
            try { navigator.clipboard.writeText(code).then(ok, () => toast('Couldn’t copy. Write the code down instead.')); } catch (e) { toast('Couldn’t copy. Write the code down instead.'); }
        },
        enter: () => enterMove(() => moveMenu(back)),
        back: () => back ? back() : closeModal(),
    });
    drawQR($('moveQR'), link);
}

function enterMove(back) {
    modal(`<h2>Bring progress here</h2>
        <p>Enter the code from your other device, or scan its QR code.</p>
        <input class="code-in" id="moveIn" placeholder="XXXXX-XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="24">
        <p class="small msg-err" id="moveMsg" style="margin:.4rem 0 0;min-height:1.2em"></p>
        <video class="scan-vid" id="scanVid" playsinline muted hidden></video>
        <div class="acts">
            <button class="btn green" data-act="load">Load</button>
            <button class="btn white" data-act="scan"><i class="fa-solid fa-camera"></i> Scan a QR code</button>
            <button class="link" data-act="back">Back</button>
        </div>`, {
        load: () => {
            const m = readMove($('moveIn').value);
            if (m) confirmMove(m, back); else $('moveMsg').textContent = 'That code doesn’t look right. Check it and try again.';
        },
        scan: () => startScan(text => { const m = readMove(text); if (m) { confirmMove(m, back); return true; } return false; }),
        back,
    });
    $('moveIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('card').querySelector('[data-act="load"]').click(); });
}

function confirmMove(m, back) {
    const behind = m.lvl < save.lvl;
    modal(`<div class="icon-big"><i class="fa-solid fa-mobile-screen-button"></i></div>
        <h2>Load this progress?</h2>
        <p><b>${moveSummary(m)}</b>, ${m.hammer} hammer${m.hammer === 1 ? '' : 's'} and ${m.magnet} magnet${m.magnet === 1 ? '' : 's'}.</p>
        <p>It replaces <b>${moveSummary(save)}</b> on this device.${behind ? ' <span class="msg-err">That’s behind where this device is.</span>' : ''}</p>
        <div class="acts">
            <button class="btn green" data-act="yes">Load it</button>
            <button class="link" data-act="no">Cancel</button>
        </div>`, {
        yes: () => applyMove(m),
        no: back || closeModal,
    });
}

function loadScript(src, integrity) {
    return new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = src; el.integrity = integrity; el.crossOrigin = 'anonymous';
        el.onload = resolve; el.onerror = () => reject(new Error('Could not load ' + src));
        document.head.appendChild(el);
    });
}
const QR_LIB = ['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', 'sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1'];
const SCAN_LIB = ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx'];
async function drawQR(c, text) {
    try {
        if (!window.qrcode) await loadScript(...QR_LIB);
        if (!c.isConnected) return;
        const q = qrcode(0, 'M'); q.addData(text); q.make();
        const n = q.getModuleCount(), size = 456, cell = Math.floor(size / (n + 6)), off = Math.floor((size - cell * n) / 2);
        c.width = c.height = size;
        const g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
        g.fillStyle = '#3b2a63';
        for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect(off + k * cell, off + r * cell, cell, cell);
        c.hidden = false;
    } catch (e) { /* offline: the code alone still works */ }
}

// Camera scanning: BarcodeDetector where there is one, jsQR otherwise. `found` returns
// true when the text was a code it could use.
let scanStream = null, scanTimer = 0;
async function startScan(found) {
    const video = $('scanVid'), msg = $('moveMsg');
    msg.textContent = '';
    try {
        scanStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}}, audio: false});
    } catch (e) { msg.textContent = 'Couldn’t open the camera. Type the code instead.'; return; }
    if (!video.isConnected) { stopScan(); return; }
    video.hidden = false;
    video.srcObject = scanStream;
    try { await video.play(); } catch (e) { /* plays once it can */ }
    let detector = null;
    if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({formats: ['qr_code']}); } catch (e) { /* no QR support */ } }
    if (!detector && !window.jsQR) { try { await loadScript(...SCAN_LIB); } catch (e) { msg.textContent = 'Couldn’t load the scanner. Type the code instead.'; stopScan(); return; } }
    const cnv = document.createElement('canvas'), g = cnv.getContext('2d', {willReadFrequently: true});
    const tick = async () => {
        if (!scanStream) return;
        let text = null;
        if (video.readyState >= 2) {
            if (detector) { const codes = await detector.detect(video).catch(() => []); text = codes[0] && codes[0].rawValue; }
            else {
                const k = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
                cnv.width = Math.round(video.videoWidth * k); cnv.height = Math.round(video.videoHeight * k);
                g.drawImage(video, 0, 0, cnv.width, cnv.height);
                const hit = jsQR(g.getImageData(0, 0, cnv.width, cnv.height).data, cnv.width, cnv.height, {inversionAttempts: 'dontInvert'});
                text = hit && hit.data;
            }
        }
        if (text && found(text)) return;
        scanTimer = setTimeout(tick, 200);
    };
    tick();
}
function stopScan() {
    clearTimeout(scanTimer);
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}

/* ---------- input ---------- */
function hitCell(x, y) {
    const L = Lay, cx = Math.floor((x - L.bx) / L.c), cy = Math.floor((y - L.by) / L.c);
    if (cx < 0 || cy < 0 || cx >= G.w || cy >= G.h) return -1;
    return cy * G.w + cx;
}
const near = (p, x, y, r) => Math.hypot(p.x - x, p.y + p.r * 0.1 - y) <= r;

// Did the last tap on the board do something? Only then does it get the iPhone tick.
let tapWorked = false;
const tapLayer = $('tapLayer'), tapSwitch = $('tapSwitch');
tapLayer.addEventListener('pointerdown', e => { audio(); tapWorked = boardTap(e) === true; });
tapLayer.addEventListener('click', e => {
    if (e.target === tapSwitch) return;   // the label passing its click on to the switch
    // Android buzzes through navigator.vibrate instead, so the switch only flips on iPhones
    if (!tapWorked || !save.haptics || navigator.vibrate) e.preventDefault();
    tapWorked = false;
});

function boardTap(e) {
    if (!G || !Lay || modalOpen || G.over) return false;
    const rect = cv.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (aim === 'hammer') {
        const i = hitCell(x, y);
        const hit = i >= 0 && G.hp[i] - G.want[i] > 0 && pay('hammer') && smash(G, i) > 0;
        aim = null; hud(); persist();
        return hit;
    }
    if (aim === 'magnet') {
        for (let q = 0; q < G.qs.length; q++) for (let k = 1; k < Math.min(4, G.qs[q].length); k++) {
            const p = qPos(q, k);
            if (near(p, x, y, p.r * 1.15) && pay('magnet')) { pull(G, G.qs[q][k]); aim = null; hud(); persist(); return true; }
        }
        aim = null; hud();
        return false;
    }
    for (let s = 0; s < G.tray.length; s++) {
        const p = slotPos(s);
        if (near(p, x, y, Lay.sr * 1.3)) return G.tray[s] >= 0 && tryLaunch({slot: s});
    }
    for (let q = 0; q < G.qs.length; q++) {
        const p = qPos(q, 0);
        if (Math.abs(x - p.x) < Math.max(p.r * 1.4, 26) && y > p.y - p.r * 1.4 && y < p.y + p.r * 1.6) return tryLaunch({q});
    }
    return false;
}

function tryLaunch(from) {
    const r = launch(G, from);
    if (r === 'ok') { if (G.n === 1 && G.moves === 1) tip('shoot'); persist(); return true; }
    // the reminder that the track is full is for learning; later the pink pips say it
    if (r === 'full') { if (G.n <= 5) tip('cap', true); SND.nope(); }
    if (r === 'frozen') {
        const j = G.jel[from.q != null ? G.qs[from.q][0] : G.tray[from.slot]];
        toast(`Frozen: it thaws after ${j.frz} more jell${j.frz === 1 ? 'y goes' : 'ies go'} out.`);
        SND.nope();
    }
    return false;
}

for (const b of document.querySelectorAll('.boost')) {
    b.addEventListener('click', () => {
        audio();
        if (!G || modalOpen || G.over) return;
        const k = b.dataset.b;
        if (G.n < UNLOCK[k] && !testLevel) { toast(`Unlocks at level ${UNLOCK[k]}.`); return; }
        if (aim === k) { aim = null; hud(); return; }
        if (save.boost[k] <= 0 && save.coins < PRICE[k]) { toast(`Not enough coins: that costs ${PRICE[k]}.`); SND.nope(); return; }
        if (k === 'magnet' && !G.qs.some(q => q.length > 1)) { toast('No jellies waiting behind the fronts.'); return; }
        aim = k; hud();
        toast(k === 'hammer' ? 'Tap the picture to smash.' : 'Tap a jelly in a line to pull it forward.');
    });
}

$('pauseBtn').onclick = () => { audio(); if (G && !G.over && !modalOpen) pauseMenu(); };
function setSound(on) {
    save.sound = on;
    persist();
    syncSound();
    if (on) SND.coin();
}
function syncSound() {
    for (const b of document.querySelectorAll('.sound-btn')) {
        b.classList.toggle('muted', !save.sound);
        b.setAttribute('aria-label', save.sound ? 'Sound on' : 'Sound off');
        b.title = save.sound ? 'Sound on' : 'Sound off';
        b.querySelector('i').className = save.sound ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
    }
}
for (const b of document.querySelectorAll('.sound-btn')) b.onclick = () => setSound(!save.sound);
$('fastBtn').onclick = () => { save.fast = !save.fast; persist(); hud(); toast(save.fast ? 'Fast track on' : 'Fast track off'); };
$('playBtn').onclick = () => { audio(); startLevel(true); };
$('howBtn').onclick = () => { audio(); howTo(); };
$('homeSettings').onclick = () => { audio(); settingsMenu(); };
$('albumChip').onclick = () => show('album');
$('streakChip').onclick = () => toast(save.streak ? `${save.streak} wins in a row: +${Math.min(save.streak, 3) * 5} bonus coins a win.` : 'Win levels in a row for bonus coins.');
$('albumBack').onclick = () => show('home');
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    clock += dt;
    if (screenName === 'play' && !G) render(dt);
    else if (screenName === 'play' && G) {
        if (!modalOpen && !document.hidden) step(G, dt * (save.fast ? 1.8 : 1) * (G.auto ? 2.5 : 1));
        syncJellies(dt);
        drainFx();
        render(dt);
        if (G.over === 'won' && winAt && clock - winAt > 1.5 && !modalOpen) { winAt = 0; finishWin(); }
        if (G.over === 'full' && fullAt && clock - fullAt > 0.7 && !modalOpen) { fullAt = 0; showFull(); }
    } else if (screenName === 'home') drawMascot();
    requestAnimationFrame(frame);
}

const mascot = $('mascot'), mctx = mascot.getContext('2d');
let mascotColor = 10;
function drawMascot() {
    const d = Math.min(window.devicePixelRatio || 1, 2.5), s = mascot.clientWidth || 144;
    if (mascot.width !== Math.round(s * d)) { mascot.width = mascot.height = Math.round(s * d); }
    mctx.setTransform(d, 0, 0, d, 0, 0);
    mctx.clearRect(0, 0, s, s);
    const t = clock, bob = Math.sin(t * 3) * s * 0.03;
    const cubes = ['R', 'Y', 'B', 'G'];
    cubes.forEach((k, i) => {
        const cs = s * 0.15, x = s * 0.5 + (i - 1.5) * cs * 1.1 - cs / 2, y = s * 0.08 + Math.sin(t * 2 + i) * 3;
        mctx.drawImage(cubeImg(KEYS.indexOf(k) + 1, cs * d), x, y, cs, cs);
    });
    if (Math.floor(t / 2.4) !== Math.floor((t - 1 / 60) / 2.4)) mascotColor = 1 + Math.floor(Math.random() * 10);
    drawJelly(mctx, s * 0.5, s * 0.55 + bob, s * 0.26, [1, 2, 3, 4, 6, 8, 9, 10, 7, 5][mascotColor % 10], {board: true, sq: Math.sin(t * 6) * 0.04, ly: -1, blink: (t % 3.3) < 0.12});
}

// iPhone home screen app quirks (the ant farm has the same fix, checked on a real phone):
// the status bar blurs whatever sits just under it, so the top bars move down a little;
// and the app's viewport comes up short by about the status bar's height, leaving a
// strip at the bottom that can't be drawn on, so nothing needs room for the home bar.
const insetProbe = document.createElement('div');
insetProbe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top)';
document.body.append(insetProbe);
function fitPhone() {
    const rs = document.documentElement.style, top = parseFloat(getComputedStyle(insetProbe).paddingTop) || 0;
    const app = navigator.standalone === true;
    rs.setProperty('--drop', app && top ? '20px' : '0px');
    const lost = app ? Math.round(screen.height - innerHeight) : 0;
    if (lost > 10 && Math.abs(lost - top) < 12) rs.setProperty('--sab', '0px'); else rs.removeProperty('--sab');
}
fitPhone();
// Shown small in Settings, so a screenshot says which version is running and what the
// phone reports about its screen.
const BUILD = '2026-10-18e';
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function screenInfo() {
    const top = Math.round(parseFloat(getComputedStyle(insetProbe).paddingTop) || 0);
    const app = navigator.standalone === true ? 'home screen app' : 'browser';
    const ios = (navigator.userAgent.match(/OS (\d+)_(\d+)/) || []).slice(1).join('.');
    return `Version ${BUILD}${ios ? ' · iOS ' + ios : ''} · ${app} · sound ${save.sound ? 'on' : 'off'} · screen ${screen.width}x${screen.height}, view ${innerWidth}x${innerHeight}, top ${top}, lift ${getComputedStyle(document.documentElement).getPropertyValue('--drop').trim() || '0px'}`;
}
function onResize() { fitPhone(); if (screenName === 'play') layout(); }
addEventListener('resize', onResize);
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); last = performance.now(); });
addEventListener('pagehide', persist);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('jelly-sw.js', {scope: './jelly'}).catch(() => {});
}

if (testLevel) startLevel(false); else show('home');
// A move link (from the QR code) opens straight into the card that loads it.
function checkMoveLink() {
    if (!location.hash.startsWith('#move=')) return;
    const m = readMove(location.hash);
    history.replaceState(null, '', location.pathname + location.search);
    if (m && !testLevel) confirmMove(m); else if (!m) toast('That move link didn’t work. Try typing the code instead.');
}
checkMoveLink();
addEventListener('hashchange', checkMoveLink);
requestAnimationFrame(frame);
</script>
